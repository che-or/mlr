
name: Update Web Data

on:
  schedule:
    - cron:  '21 6 * * *' # Runs every day around midnight CT (6:21 UTC). Off-the-hour to avoid GitHub's cron congestion at round hours.
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python script to generate web data
      id: generate
      run: cd scripts && python generate_web_data.py
      continue-on-error: true

    - name: Commit and push if there are changes
      if: always()
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated update of web data"
        file_pattern: >-
          docs/**/*.json
          data/raw_gamelogs/*.csv
          data/raw_player_types/*.csv
          data/cache/*.csv
          data/cache/*.json
          data/re_matrices/*.csv
          data/fip_constants.csv
          data/pitcher_decision_adjustments.csv
          data/game_played_adjustments.csv
          data/runs_scored_adjustments.csv

    - name: Fail job if data generation failed
      if: steps.generate.outcome == 'failure'
      run: |
        echo "generate_web_data.py failed - see the 'Run Python script to generate web data' step above for details. Raw/intermediate data from this run was still committed for debugging." >&2
        exit 1
